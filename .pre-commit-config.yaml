repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-toml
    -   id: check-added-large-files

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
    -   id: ruff
        args: [--fix]
    -   id: ruff-format
        types_or: [python, pyi, jupyter, markdown]

-   repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.6
    hooks:
    -   id: uv-lock
    -   id: uv-export
        name: uv-export requirements.txt
        args: [--frozen, --no-hashes, --no-emit-project, --no-default-groups, -o, requirements.txt]
        files: ^(pyproject\.toml|uv\.lock|requirements\.txt)$
    -   id: uv-export
        name: uv-export requirements-all.txt
        args: [--frozen, --no-hashes, --no-emit-project, --all-extras, --all-groups, -o, requirements-all.txt]
        files: ^(pyproject\.toml|uv\.lock|requirements-all\.txt)$
